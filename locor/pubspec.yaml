name: locor
description: Build AppLocalizations class with `Intl` getters from a YAML file with placeholder support
version: 0.5.0
repository: https://github.com/digitalrmdy/locor

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  source_gen: ^4.2.1
  build: ^4.0.4
  yaml: ^3.1.3
  dart_style: ^3.1.7
  code_builder: ^4.11.1
  # Verified constraint: analyzer 12.x is not currently resolvable with this toolchain.
  analyzer: ^10.0.1
  glob: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.13.0
  flutter_test:
    sdk: flutter

flutter: